[workspace]
authors = ["Jakub Wlodek <jwlodek.dev@gmail.com>"]
channels = ["conda-forge"]
name = "virtual-pilatus3"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
camserver = "./camserver_sim.py"
lint = "pre-commit run --all-files"
test = "pytest"

[dependencies]
tifffile = ">=2025.10.16,<2026"
numpy = "*"
ruff = ">=0.14.1,<0.15"
pre-commit = ">=4.3.0,<5"
python = ">=3.12.0,<3.13"
pytest = ">=8.4.2,<9"
